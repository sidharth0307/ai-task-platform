name: CI/CD Pipeline

# Trigger the pipeline whenever code is pushed to the main branch
on:
  push:
    branches:
      - main

# Define the environment variables we will use across jobs
env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    name: Lint Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # We install dependencies and run standard linting for both node environments
      - name: Lint Backend
        working-directory: ./backend
        run: |
          npm ci
          npm run lint --if-present

      - name: Lint Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint --if-present

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: lint # This ensures we don't build broken, unlinted code
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/ai-backend:${{ env.IMAGE_TAG }},${{ env.DOCKER_USERNAME }}/ai-backend:latest

      - name: Build and Push Worker
        uses: docker/build-push-action@v4
        with:
          context: ./worker
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/ai-worker:${{ env.IMAGE_TAG }},${{ env.DOCKER_USERNAME }}/ai-worker:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/ai-frontend:${{ env.IMAGE_TAG }},${{ env.DOCKER_USERNAME }}/ai-frontend:latest

  update-infra:
    name: Update Infrastructure Repository
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout Infra Repository
        uses: actions/checkout@v3
        with:
          repository: sidharth0307/ai-task-platform-infra
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: infra-repo

      # We use 'sed' to perform a find-and-replace on the image tags in our Kubernetes manifests
      - name: Update Image Tags in Kubernetes Manifests
        working-directory: ./infra-repo
        run: |
          sed -i "s|image: ${{ env.DOCKER_USERNAME }}/ai-backend:.*|image: ${{ env.DOCKER_USERNAME }}/ai-backend:${{ env.IMAGE_TAG }}|g" kubernetes/backend/deployment.yaml
          sed -i "s|image: ${{ env.DOCKER_USERNAME }}/ai-worker:.*|image: ${{ env.DOCKER_USERNAME }}/ai-worker:${{ env.IMAGE_TAG }}|g" kubernetes/worker/deployment.yaml
          sed -i "s|image: ${{ env.DOCKER_USERNAME }}/ai-frontend:.*|image: ${{ env.DOCKER_USERNAME }}/ai-frontend:${{ env.IMAGE_TAG }}|g" kubernetes/frontend/deployment.yaml

      - name: Commit and Push Changes
        working-directory: ./infra-repo
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add .
          git commit -m "chore: update image tags to ${{ env.IMAGE_TAG }} [skip ci]"
          git push origin main